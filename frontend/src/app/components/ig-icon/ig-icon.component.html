<svg
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 24 24"
  fill="none"
  [class]="className()"
  [attr.stroke]="filled() ? 'none' : 'currentColor'"
  [attr.stroke-width]="strokeWidth()"
  stroke-linecap="round"
  stroke-linejoin="round"
  class="ig-svg-icon"
>
  @switch (name()) {
    @case ('arrow-left') {
      <line x1="19" y1="12" x2="5" y2="12"></line>
      <polyline points="12 19 5 12 12 5"></polyline>
    }
    @case ('chevron-right') {
      <polyline points="9 18 15 12 9 6"></polyline>
    }
    @case ('trending-up') {
      <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
      <polyline points="17 6 23 6 23 12"></polyline>
    }
    @case ('more-vertical') {
      <circle cx="12" cy="5" r="1.5" fill="currentColor"></circle>
      <circle cx="12" cy="12" r="1.5" fill="currentColor"></circle>
      <circle cx="12" cy="19" r="1.5" fill="currentColor"></circle>
    }
    @case ('menu-bars') {
      <line x1="3" y1="9" x2="21" y2="9" stroke-width="2.3"></line>
      <line x1="3" y1="15" x2="21" y2="15" stroke-width="2.3"></line>
    }
    @case ('heart') {
      @if (filled()) {
        <path
          d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
          fill="#ed4956"
        ></path>
      } @else {
        <path
          d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
        ></path>
      }
    }
    @case ('heart-slash') {
      <!-- Heart with diagonal slash for "Hide like count to others" -->
      <path d="M19.5 7.5A5.5 5.5 0 0 0 12 5.67l-.5.5-.5-.5A5.5 5.5 0 0 0 2 11.23c0 2.2 1.3 4.1 3 5.5l7 6.5 2.5-2.3"></path>
      <line x1="3" y1="3" x2="21" y2="21" stroke-width="2"></line>
    }
    @case ('comment') {
      <!-- Exact official Instagram comment icon with tail on the right -->
      <path
        d="M20.656 17.008a9.993 9.993 0 1 0-3.59 3.615L22 22Z"
        fill="none"
        stroke="currentColor"
        stroke-linejoin="round"
      ></path>
    }
    @case ('comment-slash') {
      <!-- Official Instagram comment icon with slash -->
      <path
        d="M20.656 17.008a9.993 9.993 0 1 0-3.59 3.615L22 22Z"
        fill="none"
        stroke="currentColor"
        stroke-linejoin="round"
      ></path>
      <line x1="3" y1="3" x2="21" y2="21" stroke-width="2"></line>
    }
    @case ('repost') {
      <path d="M17 2l4 4-4 4"></path>
      <path d="M3 11v-1a4 4 0 0 1 4-4h14"></path>
      <path d="M7 22l-4-4 4-4"></path>
      <path d="M21 13v1a4 4 0 0 1-4 4H3"></path>
    }
    @case ('share') {
      <line x1="22" y1="2" x2="11" y2="13"></line>
      <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
    }
    @case ('share-slash') {
      <path d="M22 2l-7 20-4-9-9-4 20-7z"></path>
      <line x1="2" y1="2" x2="22" y2="22" stroke-width="2"></line>
    }
    @case ('bookmark') {
      @if (filled()) {
        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" fill="currentColor"></path>
      } @else {
        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
      }
    }
    @case ('camera-remix') {
      <!-- Square box with circular rotation arrows and plus inside -->
      <rect x="3" y="3" width="18" height="18" rx="4" stroke-width="1.8"></rect>
      <path d="M8 12h8"></path>
      <path d="M12 8v8"></path>
      <path d="M16 4l2 2-2 2"></path>
      <path d="M8 20l-2-2 2-2"></path>
    }
    @case ('archive') {
      <polyline points="1 4 1 10 7 10"></polyline>
      <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
      <polyline points="12 7 12 12 15 15"></polyline>
    }
    @case ('qr-code') {
      <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
      <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
      <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
      <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
      <rect x="5.5" y="5.5" width="2" height="2" fill="currentColor"></rect>
      <rect x="16.5" y="5.5" width="2" height="2" fill="currentColor"></rect>
      <rect x="16.5" y="16.5" width="2" height="2" fill="currentColor"></rect>
      <rect x="5.5" y="16.5" width="2" height="2" fill="currentColor"></rect>
    }
    @case ('shopping-bag') {
      <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <path d="M16 10a4 4 0 0 1-8 0"></path>
    }
    @case ('download-slash') {
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
      <polyline points="7 10 12 15 17 10"></polyline>
      <line x1="12" y1="15" x2="12" y2="3"></line>
      <line x1="3" y1="3" x2="21" y2="21" stroke-width="2"></line>
    }
    @case ('edit') {
      <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
      <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
    }
    @case ('crop') {
      <!-- Framing corner brackets -->
      <path d="M4 8V4h4"></path>
      <path d="M20 8V4h-4"></path>
      <path d="M4 16v4h4"></path>
      <path d="M20 16v4h-4"></path>
    }
    @case ('chart-bar') {
      <line x1="12" y1="20" x2="12" y2="10" stroke-width="2"></line>
      <line x1="18" y1="20" x2="18" y2="4" stroke-width="2"></line>
      <line x1="6" y1="20" x2="6" y2="15" stroke-width="2"></line>
    }
    @case ('content-ad-labels') {
      <!-- User with check badge -->
      <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
      <circle cx="8.5" cy="7" r="4"></circle>
      <polyline points="17 11 19 13 23 9"></polyline>
    }
    @case ('partnership') {
      <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
      <circle cx="8.5" cy="7" r="4"></circle>
      <polyline points="17 11 19 13 23 9"></polyline>
    }
    @case ('ban') {
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
    }
    @case ('minus-circle') {
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="8" y1="12" x2="16" y2="12" stroke-width="2"></line>
    }
    @case ('pin') {
      <!-- Pushpin icon -->
      <line x1="12" y1="17" x2="12" y2="22"></line>
      <path d="M5 17h14l-2-6V5h1V3H6v2h1v6z"></path>
    }
    @case ('translations') {
      <!-- Translation chat bubbles -->
      <path d="M4 4h10a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H9l-4 3v-3H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path>
      <path d="M17 9h3a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-1v3l-4-3h-2"></path>
      <text x="6" y="10" font-size="7" font-weight="bold" fill="currentColor" stroke="none">文</text>
    }
    @case ('closed-captions') {
      <!-- CC in box -->
      <rect x="2" y="5" width="20" height="14" rx="3"></rect>
      <path d="M9 10a2 2 0 0 0-2 2v0a2 2 0 0 0 2 2"></path>
      <path d="M16 10a2 2 0 0 0-2 2v0a2 2 0 0 0 2 2"></path>
    }
    @case ('trash') {
      <!-- Red trash can -->
      <polyline points="3 6 5 6 21 6"></polyline>
      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
      <line x1="10" y1="11" x2="10" y2="17"></line>
      <line x1="14" y1="11" x2="14" y2="17"></line>
    }
    @case ('play') {
      <polygon points="5 3 19 12 5 21 5 3" fill="currentColor"></polygon>
    }
    @case ('play-circle') {
      <circle cx="12" cy="12" r="10"></circle>
      <polygon points="10 8 16 12 10 16 10 8" fill="currentColor"></polygon>
    }
    @case ('info') {
      <circle cx="12" cy="12" r="9"></circle>
      <line x1="12" y1="16" x2="12" y2="12"></line>
      <line x1="12" y1="8" x2="12.01" y2="8"></line>
    }
    @case ('clock') {
      <circle cx="12" cy="12" r="10"></circle>
      <polyline points="12 6 12 12 16 14"></polyline>
    }
    @case ('volume-x') {
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon>
      <line x1="23" y1="9" x2="17" y2="15"></line>
      <line x1="17" y1="9" x2="23" y2="15"></line>
    }
    @case ('volume-2') {
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
    }
    @case ('eye') {
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
      <circle cx="12" cy="12" r="3"></circle>
    }
    @case ('music') {
      <path d="M9 18V5l12-2v13"></path>
      <circle cx="6" cy="18" r="3"></circle>
      <circle cx="18" cy="16" r="3"></circle>
    }
    @case ('close') {
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    }
    @case ('plus') {
      <line x1="12" y1="5" x2="12" y2="19"></line>
      <line x1="5" y1="12" x2="19" y2="12"></line>
    }
    @case ('plus-square') {
      <rect x="3" y="3" width="18" height="18" rx="4" ry="4"></rect>
      <line x1="12" y1="8" x2="12" y2="16"></line>
      <line x1="8" y1="12" x2="16" y2="12"></line>
    }
    @case ('trash') {
      <polyline points="3 6 5 6 21 6"></polyline>
      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
    }
    @default {
      <circle cx="12" cy="12" r="10"></circle>
    }
  }
</svg>
